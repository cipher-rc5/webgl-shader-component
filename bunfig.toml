[install]
# Allow semver ranges to resolve to newest matching release
exact = false

# Enable optional peer dependencies
optional = true

# Improve install performance
frozenLockfile = false
production = false

[install.cache]
# Enable package caching
disable = false

[run]
# Run package.json scripts and shebangs with Bun instead of Node
bun = true

# Use Bun's built-in shell for script execution
shell = "bun"

[test]
# Register a DOM implementation before React Testing Library loads
preload = ["./test/setup.ts"]
